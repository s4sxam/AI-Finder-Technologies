name: Refresh Live AI Benchmarks

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and normalize benchmarks
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
        run: npx tsx scripts/fetch-benchmarks.ts

      - name: Validate benchmarks data integrity
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("src/data/live/benchmarks.json", "utf8"));
            if (!data.models || !Array.isArray(data.models) || data.models.length === 0) {
              console.error("Invalid benchmarks data: empty models array");
              process.exit(1);
            }
            if (typeof data.totalModels !== "number" || data.totalModels <= 0) {
              console.error("Invalid totalModels count");
              process.exit(1);
            }
            console.log("Validated benchmarks data: " + data.models.length + " models present.");
          '

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/live/benchmarks.json src/data/live/history.json
          if git diff --staged --quiet; then
            echo "No changes in benchmarks data. Skipping commit."
          else
            git commit -m "chore(data): refresh live benchmarks from Artificial Analysis & OpenRouter"
            git push
          fi
