<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0B0F19"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2F5BFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="200" r="450" fill="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="16" fill="#131A2A" stroke="#1E293B" stroke-width="2"/>
    <path d="M16 26V16H26" stroke="#2F5BFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 26V16H46" stroke="#2F5BFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 46V56H26" stroke="#2F5BFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 46V56H46" stroke="#2F5BFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="36" cy="36" r="8" fill="#2F5BFF"/>
    <path d="M36 20V26M36 46V52M20 36H26M46 36H52" stroke="#2F5BFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Branding -->
  <text x="190" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="-0.03em">
    AI Finder <tspan font-weight="400" font-size="24" fill="#94A3B8" letter-spacing="0.05em">TECHNOLOGIES</tspan>
  </text>

  <!-- Tagline & Heading -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="56" fill="#FFFFFF" letter-spacing="-0.03em">
    The Curated Directory of Premier AI Tools
  </text>
  
  <text x="100" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
    60+ Verified Software Evaluations · Side-by-Side Comparison Matrix · 10 Benchmark Guides
  </text>

  <!-- Feature Pills / Disciplines -->
  <g transform="translate(100, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="44" rx="8" fill="#131A2A" stroke="#1E293B"/>
    <text x="65" y="27" font-family="monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Coding &amp; Dev</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="130" height="44" rx="8" fill="#131A2A" stroke="#1E293B"/>
    <text x="210" y="27" font-family="monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Reasoning</text>

    <!-- Pill 3 -->
    <rect x="290" y="0" width="130" height="44" rx="8" fill="#131A2A" stroke="#1E293B"/>
    <text x="355" y="27" font-family="monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Image &amp; 3D</text>

    <!-- Pill 4 -->
    <rect x="435" y="0" width="130" height="44" rx="8" fill="#131A2A" stroke="#1E293B"/>
    <text x="500" y="27" font-family="monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Video Motion</text>

    <!-- Pill 5 -->
    <rect x="580" y="0" width="130" height="44" rx="8" fill="#131A2A" stroke="#1E293B"/>
    <text x="645" y="27" font-family="monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Audio &amp; Voice</text>

    <!-- Pill 6 -->
    <rect x="725" y="0" width="130" height="44" rx="8" fill="#131A2A" stroke="#1E293B"/>
    <text x="790" y="27" font-family="monospace" font-size="14" font-weight="600" fill="#E2E8F0" text-anchor="middle">Research</text>
  </g>

  <!-- Bottom Authority Bar -->
  <line x1="100" y1="530" x2="1100" y2="530" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748B">
    https://ai-finder-ruddy.vercel.app · Zero Sponsored Rankings · WCAG 2.2 AA Compliant
  </text>
  <text x="1100" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2F5BFF" text-anchor="end">
    Independent Evaluation Lab
  </text>
</svg>
